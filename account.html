<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your account — Sweet Tooth</title>
  <meta name="theme-color" content="#F3AEA8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=DM+Mono:wght@400;500&family=Jost:wght@400;500;600&family=Pinyon+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header" data-header></header>
  <main class="page" id="main">
    <div class="wrap">
      <!-- Signed out -->
      <section data-signed-out hidden>
        <div class="split">
          <div>
            <p class="eyebrow">Welcome</p>
            <h1 class="page-title">Hello, <span class="script">sweet tooth</span></h1>
            <p class="muted" style="max-width:44ch">Sign in to send orders and watch them go from <b>requested</b> to <b>delivered</b>. Your account is protected by Google Firebase Authentication.</p>
          </div>
          <div class="panel">
            <div class="tabs" role="tablist" aria-label="Sign in or create account">
              <button class="tab" role="tab" aria-selected="true" data-tab="signin">Sign in</button>
              <button class="tab" role="tab" aria-selected="false" data-tab="signup">Create account</button>
            </div>

            <button class="btn google-btn btn-block" data-google type="button">
              <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
              Continue with Google
            </button>
            <div class="divider">or with email</div>

            <form data-auth-form novalidate>
              <div class="field" data-name-field hidden><label for="dname">Your name</label><input class="input" id="dname" name="dname" autocomplete="name" maxlength="80"></div>
              <div class="field"><label for="email">Email</label><input class="input" id="email" name="email" type="email" autocomplete="email" required></div>
              <div class="field"><label for="password">Password</label><input class="input" id="password" name="password" type="password" autocomplete="current-password" required minlength="8"><span class="hint" data-pw-hint hidden>At least 8 characters.</span></div>
              <p class="form-error" data-error role="alert"></p>
              <button class="btn btn-primary btn-block" data-submit>Sign in</button>
            </form>
            <p style="margin:1rem 0 0;text-align:center"><button class="link-btn" data-forgot type="button">Forgot your password?</button></p>
          </div>
        </div>
      </section>

      <!-- Signed in -->
      <section data-signed-in hidden>
        <p class="eyebrow">Your account</p>
        <h1 class="page-title">Hi, <span class="script" data-hi>friend</span></h1>
        <p class="muted" data-email style="margin:0 0 2rem"></p>
        <div class="split">
          <form class="panel" data-profile novalidate>
            <p class="eyebrow">Saved delivery details</p>
            <div class="row-2">
              <div class="field"><label for="p-name">Name</label><input class="input" id="p-name" name="pname" autocomplete="name" maxlength="80"></div>
              <div class="field"><label for="p-phone">Phone</label><input class="input" id="p-phone" name="phone" type="tel" autocomplete="tel" maxlength="30"></div>
            </div>
            <div class="field"><label for="p-line1">Address line 1</label><input class="input" id="p-line1" name="line1" autocomplete="address-line1" maxlength="120"></div>
            <div class="field"><label for="p-line2">Address line 2</label><input class="input" id="p-line2" name="line2" autocomplete="address-line2" maxlength="120"></div>
            <div class="row-2">
              <div class="field"><label for="p-city">Town / city</label><input class="input" id="p-city" name="city" autocomplete="address-level2" maxlength="60"></div>
              <div class="field"><label for="p-post">Postcode / ZIP</label><input class="input" id="p-post" name="postcode" autocomplete="postal-code" maxlength="20"></div>
            </div>
            <button class="btn btn-primary" data-save>Save details</button>
          </form>
          <div class="panel pink">
            <p class="eyebrow">Shortcuts</p>
            <div style="display:grid;gap:.7rem">
              <a class="btn btn-primary btn-block" href="orders.html">My orders</a>
              <a class="btn btn-ghost btn-block" href="index.html#menu">Order more cookies</a>
              <button class="btn btn-danger btn-block" data-signout type="button">Sign out</button>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>
  <footer class="site-footer" data-footer></footer>
  <script type="module" src="js/account.js"></script>
</body>
</html>
